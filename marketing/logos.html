<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>BeltChase · Logos</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;1,800&family=Barlow:wght@500;600;700&display=swap" rel="stylesheet">
<!-- Pistes de logo (?v=1…4) : photo de profil ronde (Instagram, TikTok), petite pastille, en-tête du site. -->
<style>
  :root { --bg: #08122a; --gold: #f2b630; --text: #edf2fb; --muted: #8a9abb; }
  body { margin: 0; background: #04091a; color: var(--text); font-family: Barlow, sans-serif; padding: 28px 20px; }
  h1 { font: italic 800 34px/1 'Barlow Condensed'; text-transform: uppercase; margin: 0 0 4px; }
  h1 span { color: var(--gold); }
  .note { color: var(--muted); margin: 0 0 26px; max-width: 640px; }
  .row { display: flex; flex-wrap: wrap; gap: 36px; align-items: flex-end; }
  .cap { color: var(--muted); font: 700 13px 'Barlow Condensed'; letter-spacing: .08em; text-transform: uppercase; margin-top: 10px; text-align: center; }
  .pp { width: 300px; height: 300px; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 3px #1c2b4f, 0 20px 50px -20px #000; }
  .pp svg, .mini svg { width: 100%; height: 100%; display: block; }
  .mini { width: 44px; height: 44px; border-radius: 50%; overflow: hidden; }
  .feed { display: flex; align-items: center; gap: 10px; background: #000; padding: 12px 16px; border-radius: 12px; font: 600 14px Barlow; }
  .feed small { display: block; color: #a8a8a8; font-weight: 500; }
  .site { display: flex; align-items: center; gap: 8px; background: rgba(8,18,42,.95); border-bottom: 2px solid var(--gold); padding: 12px 18px; border-radius: 12px 12px 0 0; font: italic 800 28px/1 'Barlow Condensed'; letter-spacing: .03em; }
  .site .ic { width: 32px; height: 32px; }
  .site b { color: var(--gold); }
</style>
</head>
<body>
<div id="out"></div>
<script>
const G = (id) => `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset=".5" stop-color="#f2b630"/><stop offset="1" stop-color="#b9821a"/></linearGradient>
  <radialGradient id="${id}bg" cx=".5" cy=".38" r=".7"><stop offset="0" stop-color="#1b3266"/><stop offset=".6" stop-color="#0b1733"/><stop offset="1" stop-color="#060d20"/></radialGradient></defs>`;
const BG = (id) => `<rect width="512" height="512" fill="url(#${id}bg)"/><path d="M330 0h70L250 512h-70z" fill="#fff" opacity=".04"/><path d="M420 0h36L306 512h-36z" fill="#fff" opacity=".03"/>`;

// Chaque piste : icône seule (fond compris, carré 512) ; « mark » : version sans fond pour l'en-tête du site.
const LOGOS = {
  1: { name: 'Actuel · ceinture étoilée', mark: (g) => `<svg viewBox="0 0 64 64">${G(g)}<rect x="1" y="23" width="62" height="18" rx="4" fill="#1a2c55" stroke="#f2b630" stroke-width="1.6"/><path d="M3 27.5h58M3 36.5h58" stroke="#f2b630" stroke-width="1" stroke-dasharray="2.5 2.5" opacity=".7"/><rect x="6" y="25" width="9" height="14" rx="2.5" fill="url(#${g})"/><rect x="49" y="25" width="9" height="14" rx="2.5" fill="url(#${g})"/><ellipse cx="32" cy="32" rx="17" ry="19" fill="url(#${g})" stroke="#8a5e0f" stroke-width="1.4"/><ellipse cx="32" cy="32" rx="12" ry="14" fill="none" stroke="#8a5e0f" stroke-width="1.2" opacity=".7"/><path d="M32 22.5l2.9 5.9 6.5.9-4.7 4.6 1.1 6.4-5.8-3-5.8 3 1.1-6.4-4.7-4.6 6.5-.9z" fill="#fff7d6" stroke="#8a5e0f" stroke-width=".8"/></svg>`,
       icon: (g) => `<svg viewBox="0 0 512 512">${G(g)}${BG(g)}<g transform="translate(46 46) scale(6.6)"><rect x="1" y="23" width="62" height="18" rx="4" fill="#1a2c55" stroke="#f2b630" stroke-width="1.6"/><path d="M3 27.5h58M3 36.5h58" stroke="#f2b630" stroke-width="1" stroke-dasharray="2.5 2.5" opacity=".7"/><rect x="6" y="25" width="9" height="14" rx="2.5" fill="url(#${g})"/><rect x="49" y="25" width="9" height="14" rx="2.5" fill="url(#${g})"/><ellipse cx="32" cy="32" rx="17" ry="19" fill="url(#${g})" stroke="#8a5e0f" stroke-width="1.4"/><ellipse cx="32" cy="32" rx="12" ry="14" fill="none" stroke="#8a5e0f" stroke-width="1.2" opacity=".7"/><path d="M32 22.5l2.9 5.9 6.5.9-4.7 4.6 1.1 6.4-5.8-3-5.8 3 1.1-6.4-4.7-4.6 6.5-.9z" fill="#fff7d6" stroke="#8a5e0f" stroke-width=".8"/></g></svg>` },
  2: { name: 'Plaque de champion « BC »', mark: (g) => `<svg viewBox="0 0 64 64">${G(g)}<rect x="0" y="24" width="64" height="16" rx="4" fill="#1a2c55" stroke="#f2b630" stroke-width="1.6"/><path d="M32 9l19 7v17c0 11-8.5 18.5-19 22-10.5-3.5-19-11-19-22V16z" fill="url(#${g})" stroke="#8a5e0f" stroke-width="1.6"/><path d="M32 14l14.5 5.3v13.5c0 8.4-6.4 14.2-14.5 17-8.1-2.8-14.5-8.6-14.5-17V19.3z" fill="none" stroke="#8a5e0f" stroke-width="1" opacity=".6"/><text x="32" y="38.5" text-anchor="middle" font-family="Barlow Condensed" font-style="italic" font-weight="800" font-size="19" fill="#0b1733">BC</text></svg>`,
       icon: (g) => `<svg viewBox="0 0 512 512">${G(g)}${BG(g)}<g transform="translate(40 40) scale(6.75)"><rect x="0" y="24" width="64" height="16" rx="4" fill="#1a2c55" stroke="#f2b630" stroke-width="1.4"/><path d="M5 28h54M5 36h54" stroke="#f2b630" stroke-width=".8" stroke-dasharray="2 2" opacity=".6"/><path d="M32 9l19 7v17c0 11-8.5 18.5-19 22-10.5-3.5-19-11-19-22V16z" fill="url(#${g})" stroke="#8a5e0f" stroke-width="1.4"/><path d="M32 14l14.5 5.3v13.5c0 8.4-6.4 14.2-14.5 17-8.1-2.8-14.5-8.6-14.5-17V19.3z" fill="none" stroke="#8a5e0f" stroke-width=".9" opacity=".6"/><text x="32" y="38.5" text-anchor="middle" font-family="Barlow Condensed" font-style="italic" font-weight="800" font-size="19" fill="#0b1733">BC</text></g></svg>` },
  3: { name: 'Octogone « BC »', mark: (g) => `<svg viewBox="0 0 64 64">${G(g)}<path d="M21 3h22l18 18v22L43 61H21L3 43V21z" fill="#0b1733" stroke="url(#${g})" stroke-width="5"/><text x="32" y="42" text-anchor="middle" font-family="Barlow Condensed" font-style="italic" font-weight="800" font-size="27" fill="url(#${g})">BC</text></svg>`,
       icon: (g) => `<svg viewBox="0 0 512 512">${G(g)}${BG(g)}<path d="M186 66h140l120 120v140L326 446H186L66 326V186z" fill="#0b1733" stroke="url(#${g})" stroke-width="26"/><path d="M196 92h120l104 104v120L316 420H196L92 316V196z" fill="none" stroke="#f2b630" stroke-width="3" opacity=".35"/><text x="256" y="322" text-anchor="middle" font-family="Barlow Condensed" font-style="italic" font-weight="800" font-size="190" fill="url(#${g})">BC</text></svg>` },
  4: { name: 'Monogramme « B » sportif', mark: (g) => `<svg viewBox="0 0 64 64">${G(g)}<rect x="2" y="2" width="60" height="60" rx="14" fill="url(#${g})"/><text x="33" y="49" text-anchor="middle" font-family="Barlow Condensed" font-style="italic" font-weight="800" font-size="50" fill="#0b1733">B</text><path d="M8 52L56 14" stroke="#0b1733" stroke-width="3.5" opacity=".9"/></svg>`,
       icon: (g) => `<svg viewBox="0 0 512 512">${G(g)}<rect width="512" height="512" fill="url(#${g})"/><path d="M330 0h70L250 512h-70z" fill="#fff" opacity=".12"/><text x="268" y="404" text-anchor="middle" font-family="Barlow Condensed" font-style="italic" font-weight="800" font-size="400" fill="#0b1733">B</text><path d="M60 430L452 110" stroke="url(#${g})" stroke-width="30"/><path d="M60 430L452 110" stroke="#0b1733" stroke-width="16"/></svg>` },
};

const v = new URLSearchParams(location.search).get('v') || '1';
const L = LOGOS[v] || LOGOS[1];
document.title = `Logo ${v} · ${L.name}`;
document.getElementById('out').innerHTML = `
  <h1>Piste ${v} · <span>${L.name}</span></h1>
  <p class="note">Photo de profil telle qu'Instagram et TikTok la recadrent (rond), en petit dans le fil, et dans l'en-tête du site.</p>
  <div class="row">
    <div><div class="pp">${L.icon('g' + v + 'a')}</div><div class="cap">Photo de profil</div></div>
    <div><div class="feed"><div class="mini">${L.icon('g' + v + 'b')}</div><div>beltchase.officiel<small>Sponsorisé</small></div></div><div class="cap">Dans le fil (petit)</div></div>
    <div style="min-width:320px"><div class="site"><span class="ic">${L.mark('g' + v + 'c')}</span><span>BELT<b>CHASE</b></span></div><div class="cap">En-tête du site</div></div>
  </div>`;
</script>
</body>
</html>
