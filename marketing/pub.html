<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>BeltChase · Visuels pub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
<!--
  Visuels pour Instagram et TikTok (stories, reels, pubs) : 1080 × 1920, plus la photo de profil 1080 × 1080.
  Ouvrir http://localhost:5173/marketing/pub.html, bouton « Télécharger PNG » sous chaque visuel.
  Pas de vrais combattants ni de logo UFC/PFL : en publicité, il faut leur accord (droit à l'image, marques).
  Le dossier marketing/ n'est pas servi en ligne (functions/_middleware.js).
-->
<style>
  :root { --gold-grad: linear-gradient(180deg, #ffe08a, #f2b630 55%, #b9821a); }
  body { background: #04091a; color: var(--text); font-family: Barlow, system-ui, sans-serif; margin: 0; padding: 24px 16px 60px; }
  h1.pg { font: italic 800 34px/1 var(--display); text-transform: uppercase; margin: 0 0 6px; }
  .pg-note { color: var(--muted); margin: 0 0 24px; max-width: 760px; }
  .grid { display: flex; flex-wrap: wrap; gap: 28px; }
  .slot { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
  .slot b { font: 700 15px var(--display); text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .frame { width: calc(1080px * var(--k)); height: calc(1920px * var(--k)); overflow: hidden; border-radius: 14px; box-shadow: 0 20px 40px -20px #000; --k: .3; }
  .frame.square { height: calc(1080px * var(--k)); }
  .frame.portrait { height: calc(1350px * var(--k)); }
  .frame > .ad { transform: scale(var(--k)); transform-origin: 0 0; }
  .dl { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px; padding: 9px 14px; font: 700 15px var(--display); text-transform: uppercase; cursor: pointer; }
  .dl:disabled { opacity: .5; }

  /* ─── Visuel ─── */
  .ad { position: relative; width: 1080px; height: 1920px; overflow: hidden; color: #fff; font-family: Barlow, sans-serif;
    background: radial-gradient(120% 70% at 50% 30%, #15295a 0%, #08122a 55%, #040a1a 100%); }
  .ad.square { height: 1080px; }
  .ad.portrait { height: 1350px; }
  /* Carrousel (4:5) */
  .cr-mark { position: absolute; left: 50%; transform: translateX(-50%); filter: drop-shadow(0 30px 60px rgba(242,182,48,.35)); }
  .cr-swipe { position: absolute; right: 70px; bottom: 70px; font: italic 800 40px/1 var(--display); color: var(--accent); letter-spacing: .04em; }
  .cr-dots { position: absolute; left: 70px; bottom: 82px; display: flex; gap: 10px; }
  .cr-dots i { width: 16px; height: 16px; border-radius: 50%; background: rgba(255,255,255,.25); }
  .cr-dots i.on { background: var(--accent); }
  .ad.portrait .ad-foot { bottom: 150px; }
  .ad.portrait .ad-cta { bottom: 230px; }
  .ad::before { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(120deg, transparent 0 46px, rgba(255,255,255,.025) 46px 50px); }
  .ad-slash { position: absolute; top: -10%; bottom: -10%; width: 260px; background: rgba(242,182,48,.07); transform: skewX(-18deg); }
  .ad-top { position: absolute; top: 90px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 18px; }
  .ad-top svg { width: 92px; height: 92px; }
  .ad-brand { font: italic 800 72px/1 var(--display); letter-spacing: .01em; }
  .ad-brand span { color: var(--accent); }
  .ad-title { position: absolute; left: 70px; right: 70px; text-align: center; font: italic 800 150px/.88 var(--display); text-transform: uppercase; letter-spacing: -.01em; text-shadow: 0 8px 30px rgba(0,0,0,.5); }
  .ad-title em { font-style: inherit; background: var(--gold-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .ad-sub { position: absolute; left: 90px; right: 90px; text-align: center; font: 600 46px/1.25 Barlow, sans-serif; color: #c9d4ea; }
  .ad-cta { position: absolute; left: 50%; bottom: 250px; transform: translateX(-50%); white-space: nowrap; background: var(--gold-grad); color: #08122a;
    font: italic 800 64px/1 var(--display); text-transform: uppercase; padding: 34px 70px; border-radius: 22px; box-shadow: 0 18px 50px -10px rgba(242,182,48,.6); }
  .ad-foot { position: absolute; left: 0; right: 0; bottom: 140px; text-align: center; font: 700 36px/1 var(--display); letter-spacing: .08em; text-transform: uppercase; color: #8a9abb; }
  .ad-foot span { color: #fff; }

  /* 1. Pronostic */
  .mk-vs { position: absolute; left: 70px; right: 70px; top: 680px; background: rgba(15,31,64,.92); border: 3px solid #2d4a7c; border-radius: 36px; padding: 34px 40px 36px; box-shadow: 0 30px 60px -20px #000; }
  .mk-vs-head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 20px; margin-bottom: 22px; }
  .mk-corner { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .mk-corner .mk-av { width: 150px; height: 150px; border-radius: 50%; display: grid; place-items: end center; overflow: hidden; }
  .mk-corner .mk-av svg { width: 135px; }
  .mk-corner.mk-red .mk-av { background: radial-gradient(circle at 50% 30%, #ff5a6e, #8c1023); }
  .mk-corner.mk-blue .mk-av { background: radial-gradient(circle at 50% 30%, #5aa8ff, #123a8a); }
  .mk-corner strong { font: italic 800 46px/1 var(--display); text-transform: uppercase; }
  .mk-vs-x { font: italic 800 90px/1 var(--display); color: var(--accent); }
  .mk-row { display: grid; gap: 14px; margin-top: 14px; }
  .mk-row.mk-r2 { grid-template-columns: 1fr 1fr; } .mk-row.mk-r3 { grid-template-columns: repeat(3, 1fr); } .mk-row.mk-r5 { grid-template-columns: repeat(5, 1fr); }
  .mk-lbl { font: 700 26px/1 var(--display); letter-spacing: .08em; text-transform: uppercase; color: #8a9abb; margin-top: 22px; }
  .mk-odd { background: #15284f; border: 3px solid #2d4a7c; border-radius: 18px; padding: 14px 8px; text-align: center; font: 700 30px/1.1 var(--display); text-transform: uppercase; }
  .mk-odd .mk-o { display: block; font-style: normal; font-size: 38px; color: var(--accent); margin-top: 6px; }
  .mk-odd.mk-on { background: var(--gold-grad); border-color: #ffe08a; color: #08122a; box-shadow: 0 0 40px rgba(242,182,48,.55); }
  .mk-odd.mk-on .mk-o { color: #08122a; }
  .mk-win { position: absolute; right: 30px; top: 655px; transform: rotate(6deg); z-index: 2; background: #3ddc84; color: #04220f; font: italic 800 70px/1 var(--display); padding: 22px 40px; border-radius: 20px; box-shadow: 0 20px 40px -10px rgba(61,220,132,.6); }

  /* 2. Cartes */
  .mk-fan { position: absolute; left: 0; right: 0; top: 660px; height: 760px; }
  .mk-fan .fc { position: absolute; width: 420px; top: 0; left: 50%; }
  .mk-fan .fc:nth-child(1) { transform: translateX(-118%) rotate(-12deg) translateY(90px); }
  .mk-fan .fc:nth-child(2) { transform: translateX(18%) rotate(12deg) translateY(90px); }
  .mk-fan .fc:nth-child(3) { transform: translateX(-50%) scale(1.12); z-index: 2; }
  .mk-gems { position: absolute; left: 0; right: 0; top: 1420px; display: flex; justify-content: center; gap: 14px; }
  .mk-gems span { font: 800 30px/1 var(--display); text-transform: uppercase; padding: 12px 20px; border-radius: 12px; color: #08122a; }

  /* 3. Ceinture */
  .mk-belt { position: absolute; left: 50%; top: 520px; width: 760px; transform: translateX(-50%); filter: drop-shadow(0 30px 60px rgba(242,182,48,.35)); }
  .mk-ladder { position: absolute; left: 140px; right: 140px; top: 1095px; display: flex; flex-direction: column-reverse; gap: 12px; }
  .mk-ladder div { display: flex; align-items: center; gap: 22px; font: italic 800 44px/1 var(--display); text-transform: uppercase; padding: 12px 26px; border-radius: 16px; background: rgba(15,31,64,.8); border: 3px solid rgba(255,255,255,.08); }
  .mk-ladder i { width: 30px; height: 30px; border-radius: 8px; transform: rotate(45deg); flex: none; }
  .mk-ladder .mk-me { border-color: var(--accent); box-shadow: 0 0 30px rgba(242,182,48,.4); }
  .mk-ladder .mk-me small { margin-left: auto; font: 700 30px var(--display); color: var(--accent); }

  /* Profil */
  .ad.square .logo-big { position: absolute; inset: 0; display: grid; place-items: center; }
  .ad.square .logo-big svg { width: 760px; height: 760px; filter: drop-shadow(0 30px 60px rgba(242,182,48,.3)); }
</style>
</head>
<body>
  <h1 class="pg">Visuels pub BeltChase</h1>
  <p class="pg-note"><a href="?lang=fr" style="color:var(--accent)">Français</a> · <a href="?lang=en" style="color:var(--accent)">English</a> — Format 1080 × 1920 (stories, reels, TikTok, pubs Meta et TikTok) et photo de profil 1080 × 1080. Bouton sous chaque visuel pour le télécharger en PNG.</p>

<script type="module">
import { fightCardHtml } from '../js/ui/fightCard.js';
import { TIERS } from '../js/services/ranks.js';
import { lang } from '../js/i18n.js';

// Textes propres aux visuels (le reste vient de l'appli, déjà traduit) : ?lang=en pour la version anglaise.
const EN = {
  'Gratuit': 'Free', '100 % virtuel': '100% virtual', 'sans argent réel': 'no real money',
  'Tu crois': 'Think you', 'connaître': 'know', 'le MMA ?': 'MMA?', 'Coin rouge': 'Red corner', 'Coin bleu': 'Blue corner',
  'Rouge': 'Red', 'Bleu': 'Blue', 'Méthode': 'Method', 'Round': 'Round', 'Soumission': 'Submission', 'Décision': 'Decision',
  'Vainqueur, méthode, round :': 'Winner, method, round:', 'prouve-le.': 'prove it.',
  'Collectionne': 'Collect', '151 cartes': '151 cards', 'MMA · Boxe · Kick · JJB · Lutte': 'MMA · Boxing · Kickboxing · BJJ · Wrestling',
  'Commun': 'Common', 'Rare': 'Rare', 'Épique': 'Epic', 'Légendaire': 'Legendary', 'Mythique': 'Mythic',
  'Chasse': 'Chase', 'BIENTÔT': 'COMING SOON', 'Le jeu de pronos': 'The picks game', 'des fans de combat': 'for fight fans', 'SWIPE →': 'SWIPE →',
  'Pronostique': 'Predict', 'le vainqueur, la méthode, le round': 'the winner, the method, the round', 'Plus ton prono est précis, plus la cote grimpe.': 'The more precise your pick, the bigger the odds.',
  'Chaque mois, un classement.': 'A new ranking every month.', 'Chaque mois, une ceinture.': 'A new belt every month.', 'Abonne-toi': 'Follow us', 'pour le lancement': 'for the launch', 'Active les notifs 🔔': 'Turn on notifications 🔔', 'Le Sniper': 'The Sniper', 'La Machine': 'The Machine', 'Ton Champion': 'Your Champion', 'la ceinture': 'the belt', '← toi, ce mois-ci': '← you, this month',
};
const L = (s) => (lang === 'en' ? EN[s] || s : s);

const belt = document.getElementById('belt-tpl').innerHTML;
// Logo (octogone « BC ») : un identifiant de dégradé par copie, sinon les copies suivantes perdent leur or.
const markTpl = document.getElementById('mark-tpl').innerHTML;
let markN = 0;
const markSvg = () => { markN += 1; return markTpl.replaceAll('mk-gold', `mk-gold-${markN}`); };
const top = () => `<div class="ad-top">${markSvg()}<div class="ad-brand">BELT<span>CHASE</span></div></div>`;
const foot = `<div class="ad-foot">${L('Gratuit')} · <span>${L('100 % virtuel')}</span> · ${L('sans argent réel')}</div>`;
const cta = '<div class="ad-cta">beltchase.com</div>';
const fighter = `<svg viewBox="0 0 200 220"><g fill="rgba(0,0,0,.55)"><ellipse cx="100" cy="60" rx="27" ry="33"/><path d="M88 88h24l3 16H85z"/><path d="M14 220c3-56 24-92 62-104l24 8 24-8c38 12 59 48 62 104z"/></g><g fill="rgba(0,0,0,.7)"><path d="M52 150l14-46 22 4-10 50z"/><path d="M148 150l-14-46-22 4 10 50z"/><rect x="58" y="74" width="34" height="40" rx="14"/><rect x="108" y="74" width="34" height="40" rx="14"/></g></svg>`;

// Cartes fictives (pas de vrais combattants en pub) : silhouette + drapeau, comme dans l'appli.
const fake = (rarity, name, team, pos, flag) => fightCardHtml({ id: `ad-${rarity}`, name, rarity, sport: 'mma', team, national: true, pos }, { flag });

const ADS = [
  { id: 'pub-1-prono', label: '1 · Prouve-le (pronostic)', html: `
    <div class="ad-slash" style="left:-80px"></div><div class="ad-slash" style="right:-120px"></div>
    ${top()}
    <div class="ad-title" style="top:250px">${L('Tu crois')}<br>${L('connaître')}<br><em>${L('le MMA ?')}</em></div>
    <div class="mk-vs">
      <div class="mk-vs-head">
        <div class="mk-corner mk-red"><div class="mk-av">${fighter}</div><strong>${L('Coin rouge')}</strong></div>
        <div class="mk-vs-x">VS</div>
        <div class="mk-corner mk-blue"><div class="mk-av">${fighter}</div><strong>${L('Coin bleu')}</strong></div>
      </div>
      <div class="mk-row mk-r2"><div class="mk-odd mk-on">${L('Rouge')}<span class="mk-o">1,85</span></div><div class="mk-odd">${L('Bleu')}<span class="mk-o">2,10</span></div></div>
      <div class="mk-lbl">${L('Méthode')}</div>
      <div class="mk-row mk-r3"><div class="mk-odd mk-on">KO / TKO<span class="mk-o">3,40</span></div><div class="mk-odd">${L('Soumission')}<span class="mk-o">6,20</span></div><div class="mk-odd">${L('Décision')}<span class="mk-o">2,50</span></div></div>
      <div class="mk-lbl">Round</div>
      <div class="mk-row mk-r5"><div class="mk-odd">R1</div><div class="mk-odd mk-on">R2</div><div class="mk-odd">R3</div><div class="mk-odd">R4</div><div class="mk-odd">R5</div></div>
    </div>
    <div class="mk-win">+ 1 240 Gold</div>
    <div class="ad-sub" style="top:1450px;font-size:40px">${L('Vainqueur, méthode, round :')} <span style="color:#fff">${L('prouve-le.')}</span></div>
    ${cta}${foot}` },
  { id: 'pub-2-cartes', label: '2 · Collectionne (cartes)', html: `
    <div class="ad-slash" style="left:120px"></div>
    ${top()}
    <div class="ad-title" style="top:260px">${L('Collectionne')}<br><em>${L('151 cartes')}</em></div>
    <div class="ad-sub" style="top:560px">${L('MMA · Boxe · Kick · JJB · Lutte')}</div>
    <div class="mk-fan">
      ${fake('epique', L('Le Sniper'), 'Brésil', 'Poids légers', '🇧🇷')}
      ${fake('legendaire', L('La Machine'), 'États-Unis', 'Poids lourds', '🇺🇸')}
      ${fake('mythique', L('Ton Champion'), 'France', 'Poids moyens', '🇫🇷')}
    </div>
    <div class="mk-gems">
      <span style="background:#8d97a8">${L('Commun')}</span><span style="background:#6fb6ff">${L('Rare')}</span><span style="background:#c38bff">${L('Épique')}</span><span style="background:#ffe08a">${L('Légendaire')}</span><span style="background:linear-gradient(90deg,#ff5ea0,#ffb84d,#5dffb4,#58c8ff,#a77bff)">${L('Mythique')}</span>
    </div>
    ${cta}${foot}` },
  { id: 'pub-3-ceinture', label: '3 · Chasse la ceinture (classement)', html: `
    <div class="ad-slash" style="right:80px"></div>
    ${top()}
    <div class="ad-title" style="top:260px">${L('Chasse')}<br><em>${L('la ceinture')}</em></div>
    <div class="mk-belt">${belt}</div>
    <div class="mk-ladder">
      ${TIERS.slice(3).map((t) => `<div class="${t.id === 'diamond' ? 'mk-me' : ''}"><i style="background:${t.color}"></i>${t.name}${t.id === 'diamond' ? `<small>${L('← toi, ce mois-ci')}</small>` : ''}</div>`).join('')}
    </div>
    ${cta}${foot}` },
  // Carrousel de lancement (4:5, le format qui prend le plus de place dans le fil Instagram).
  { id: 'car-1', fmt: 'portrait', label: 'Carrousel 1/5 · Accroche', html: `
    <div class="ad-slash" style="left:600px"></div>
    <div class="cr-mark" style="top:150px;width:470px">${markSvg()}</div>
    <div class="ad-title" style="top:690px;font-size:120px">${L('Le jeu de pronos')}<br><em>${L('des fans de combat')}</em></div>
    <div class="ad-sub" style="top:960px">MMA · UFC · Boxe · Kick · JJB</div>
    <div class="ad-cta" style="bottom:200px">${L('BIENTÔT')}</div>
    <div class="cr-dots"><i class="on"></i><i></i><i></i><i></i><i></i></div><div class="cr-swipe">${L('SWIPE →')}</div>` },
  { id: 'car-2', fmt: 'portrait', label: 'Carrousel 2/5 · Pronostique', html: `
    <div class="ad-slash" style="left:-80px"></div>
    <div class="ad-title" style="top:110px;font-size:130px">${L('Pronostique')}</div>
    <div class="ad-sub" style="top:260px">${L('le vainqueur, la méthode, le round')}</div>

// Polices pour l'export : la bibliothèque ne sait pas lire la feuille Google Fonts (autre domaine),
// on lui donne les @font-face « latin » avec les fichiers intégrés.
let fontCss;
async function fontEmbedCss() {
  if (fontCss) return fontCss;
  const href = document.querySelector('link[href*="fonts.googleapis.com/css2"]').href;
  const css = await (await fetch(href)).text();
  const latin = css.split('/* ').filter((b) => b.startsWith('latin */')).map((b) => b.slice(9));
  const toData = async (url) => {
    const blob = await (await fetch(url)).blob();
    return new Promise((ok) => { const r = new FileReader(); r.onload = () => ok(r.result); r.readAsDataURL(blob); });
  };
  const blocks = await Promise.all(latin.map(async (b) => {
    const url = /url\(([^)]+)\)/.exec(b)?.[1];
    return url ? b.replace(url, await toData(url)) : b;
  }));
  return (fontCss = blocks.join('\n'));
}

const grid = document.getElementById('grid');
// Anglais : décimales à point et milliers à virgule (1.85, 1,240).
if (lang === 'en') for (const a of ADS) a.html = a.html.replace(/(\d),(\d{2})</g, '$1.$2<').replace(/(\d) (\d{3}) Gold/g, '$1,$2 Gold');
for (const a of ADS) {
  const slot = document.createElement('div');
  slot.className = 'slot';
  const fmt = a.fmt || (a.square ? 'square' : '');
  slot.innerHTML = `<b>${a.label}</b><div class="frame ${fmt}"><div class="ad ${fmt}" id="${a.id}">${a.html}</div></div><button class="dl" type="button">Télécharger PNG</button>`;
  grid.append(slot);
  slot.querySelector('.dl').addEventListener('click', async (e) => {
    const btn = e.currentTarget;
    btn.disabled = true;
    btn.textContent = 'Préparation…';
    try {
      const { toPng } = await import('https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/+esm');
      const node = document.getElementById(a.id);
      const url = await toPng(node, { width: 1080, height: { square: 1080, portrait: 1350 }[a.fmt || (a.square ? 'square' : '')] || 1920, pixelRatio: 1, style: { transform: 'none' }, fontEmbedCSS: await fontEmbedCss() });
      Object.assign(document.createElement('a'), { href: url, download: `beltchase-${a.id}-${lang === 'en' ? 'en' : 'fr'}.png` }).click();
      btn.textContent = 'Téléchargé ✓';
    } catch (err) {
      btn.textContent = 'Erreur, réessaie';
      console.error(err);
    }
    btn.disabled = false;
  });
}
